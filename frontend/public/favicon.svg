<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Outer lens ring -->
  <circle cx="24" cy="24" r="21" stroke="#1a4a6b" stroke-width="3" fill="#f0f7ff"/>
  <!-- Inner lens aperture -->
  <circle cx="24" cy="24" r="13" fill="#1a4a6b"/>
  <!-- Lens highlight -->
  <circle cx="24" cy="24" r="9" fill="#2563a8"/>
  <!-- Aperture blades suggestion -->
  <circle cx="24" cy="24" r="5" fill="#3b82c4"/>
  <!-- Specular highlight -->
  <ellipse cx="20" cy="20" rx="3" ry="2" fill="white" opacity="0.35" transform="rotate(-20 20 20)"/>
  <!-- Lens flare dot -->
  <circle cx="29" cy="19" r="1.2" fill="white" opacity="0.5"/>
</svg>
